name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create (for example, v0.1.0)
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --verbose --bundles appimage,deb
            tor_platform: linux
            no_strip: '1'
            tor_url: https://archive.torproject.org/tor-package-archive/torbrowser/15.0.20/tor-expert-bundle-linux-x86_64-15.0.20.tar.gz
            tor_sha256: 3b39a2a7fbf43ef28b9ae0a6afca02a12935232f81769e4fef7472d6b5676eaf
          - platform: windows-latest
            args: --bundles nsis
            tor_platform: windows
            tor_url: https://archive.torproject.org/tor-package-archive/torbrowser/15.0.20/tor-expert-bundle-windows-x86_64-15.0.20.tar.gz
            tor_sha256: d59bff934e3ad876e1623e24ae60c19aeea56f50178093b9f86fba230639f949
          # macOS release builds are paused until Napstr and its nested Tor
          # executable/library can be Developer ID signed and notarized.
          # - platform: macos-15-intel
          #   args: --bundles dmg
          #   tor_platform: macos
          #   tor_url: https://archive.torproject.org/tor-package-archive/torbrowser/15.0.20/tor-expert-bundle-macos-x86_64-15.0.20.tar.gz
          #   tor_sha256: 6ec3048b3a5d55e297f35d84830d0e338884d702aac3db49056633c1223841df
          # - platform: macos-15
          #   args: --target aarch64-apple-darwin --bundles dmg
          #   tor_platform: macos
          #   tor_url: https://archive.torproject.org/tor-package-archive/torbrowser/15.0.20/tor-expert-bundle-macos-aarch64-15.0.20.tar.gz
          #   tor_sha256: 73fdccde8136678e41a625160993e6a9dc4f4ff8cd376318b5e41e5627d55682
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.0-beta.1" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || '' }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            gstreamer1.0-alsa \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-tools \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgirepository1.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget \
            xauth \
            xvfb
      - run: npm ci
      - name: Verify interface
        run: npm run check
      - name: Test native core
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Add pinned Tor Expert Bundle
        shell: bash
        run: bash scripts/prepare-tor.sh '${{ matrix.tor_platform }}' '${{ matrix.tor_url }}' '${{ matrix.tor_sha256 }}'
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not let linuxdeploy strip the bundled, already-built Tor runtime.
          NO_STRIP: ${{ matrix.no_strip }}
          # Tor's Expert Bundle libraries are intentionally adjacent to the Tor
          # executable and are not installed into Ubuntu's global library path.
          LD_LIBRARY_PATH: ${{ matrix.tor_platform == 'linux' && format('{0}/src-tauri/resources/tor/linux/tor', github.workspace) || '' }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Napstr ${{ env.RELEASE_TAG }}
          releaseBody: Cross-platform Napstr desktop installers.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Repair and smoke-test Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then
            echo "Tauri did not produce an AppImage" >&2
            exit 1
          fi

          bash scripts/postprocess-appimage.sh "$appimage"

          smoke_log="$RUNNER_TEMP/napstr-appimage-smoke.log"
          set +e
          timeout 15s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" >"$smoke_log" 2>&1
          smoke_status=$?
          set -e
          cat "$smoke_log"

          if grep -Eqi 'EGL_BAD_PARAMETER|Unable to spawn|error while loading shared libraries' "$smoke_log"; then
            echo "The AppImage hit a known graphics, WebKit, or library startup failure" >&2
            exit 1
          fi
          if [[ "$smoke_status" -ne 124 ]]; then
            echo "The AppImage exited unexpectedly during its startup smoke test (status $smoke_status)" >&2
            exit 1
          fi

          # tauri-action has already uploaded the initial bundle. Replace that
          # asset with the repaired, verified AppImage under the same filename.
          gh release upload "$RELEASE_TAG" "$appimage" --clobber
